[project]
name = "quran-word-align"
version = "0.3.0"
description = "Word-by-word timings for Quran recitations, by CTC forced alignment on quran-asr-tiny"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy", "onnxruntime", "kaldi-native-fbank"]
authors = [{ name = "Voltaro Studio", email = "support@voltarostudio.com" }]
keywords = ["quran", "forced-alignment", "word-timings", "ctc", "arabic", "recitation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Arabic",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Religion",
]

[project.urls]
Homepage = "https://github.com/voltarostudio/quran-word-align"
Demo = "https://voltarostudio.github.io/quran-word-align/"
Dataset = "https://huggingface.co/datasets/voltarostudio/quran-word-timings-mp3quran"

[project.scripts]
quran-word-align = "quran_word_align.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quran_word_align"]

[tool.hatch.build.targets.sdist]
include = ["quran_word_align", "tests", "README.md", "LICENSE", "pyproject.toml"]

[project.optional-dependencies]
test = ["pytest"]
