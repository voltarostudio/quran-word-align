# Once a month: does mp3quran.net still serve the recordings the dataset was timed on? When one has
# changed or gone, an issue is opened listing them, as their timings no longer fit.
name: check-audio
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        run: python tools/check_audio.py --out changed.csv | tee report.txt
        continue-on-error: true
      - if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "The monthly check found recordings on mp3quran.net that differ from the ones the dataset was timed on:"; echo; echo '```'; cat report.txt; echo '```'; } > body.md
          gh issue create --title "mp3quran recordings changed ($(date +%Y-%m))" --body-file body.md
